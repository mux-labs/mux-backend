      - name: Verify SECURITY.md against test contract
        # #916: Required check. Runs test/security-md.spec.ts (previously
        # ungated) so the security policy — contacts, Response SLA, safe
        # harbor, production requirements, disclosure timeline — cannot
        # silently drift from the documented contract.
        run: pnpm exec jest --config ./test/jest-e2e.json --runTestsByPath test/security-md.spec.ts

      - name: Run key management consolidation verification
        # #918: Fail-closed required check for the custody-key invariants
        # documented in docs/key-management-consolidation.md and
        # docs/custody-security-model.md. Exit code is 0 on pass, 1 on any
        # error-severity finding, 2/3 on verifier misuse.
        run: pnpm verify:key-consolidation

