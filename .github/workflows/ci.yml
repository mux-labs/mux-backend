        run: pnpm prisma:generate

      - name: Run unit tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mux_test
          WALLET_ENCRYPTION_KEY: ci-test-encryption-key-min-32-chars-long!!
          WEBHOOK_SIGNING_KEY: ci-test-webhook-signing-key-min-32-chars-long!!

  security-md:
    name: SECURITY.md contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
